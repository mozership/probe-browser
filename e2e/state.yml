name: Browser Storage State
description: |
  Signs in on the fixture page in one step, and starts the next step's
  browser signed in from the state the first one saved.
  Serve the fixture page first, as e2e/workflow.yml does:
  go run ./e2e/server
actions:
  browser: ./action
vars:
  url: "{{ URL ?? 'http://localhost:8090' }}"
jobs:
- name: Carry a login over
  steps:
  - name: Sign in and save the state
    id: login
    uses: browser
    with:
      headless: true
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/state.html"
      # The page asks the server whom it is when it loads; that answer comes
      # first, so that it cannot land after the one the sign-in brings.
      - name: wait_text
        selector: "#server"
        equals: "server: nobody"
      - name: click
        selector: "#sign-in"
      - name: wait_text
        selector: "#server"
        equals: "server: s-7"
      # sid is HttpOnly, out of reach of the page's scripts.
      - name: get_cookie
        id: sid
        cookie_name: sid
      - name: get_cookie
        id: session
        cookie_name: session
      - name: save_storage_state
        id: state
    test: |
      res.code == 0 &&
      res.results.sid == "s-7" &&
      res.results.session == "abc123" &&
      res.filepaths.state endsWith ".json"
    outputs:
      state: res.filepaths.state

  - name: A new browser starts signed in
    uses: browser
    with:
      headless: true
      timeout: 1m
      storage_state: "{{outputs.login.state}}"
      actions:
      - name: navigate
        url: "{{vars.url}}/state.html"
      - name: wait_text
        id: cookie
        selector: "#cookie"
        contains: session=abc123
      - name: wait_text
        id: token
        selector: "#token"
        equals: "token: t-42"
      - name: wait_text
        id: server
        selector: "#server"
        equals: "server: s-7"
    test: res.code == 0

  - name: Without it a new browser is signed out
    uses: browser
    with:
      headless: true
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/state.html"
      - name: wait_text
        id: token
        selector: "#token"
        equals: "token: none"
      - name: wait_text
        id: server
        selector: "#server"
        equals: "server: nobody"
    test: res.code == 0

  - name: Of two cookies of one name, the one sent first is read
    uses: browser
    with:
      headless: true
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/state.html"
      - name: click
        selector: "#prefs"
      - name: get_cookie
        id: pref
        cookie_name: pref
    test: res.code == 0 && res.results.pref == "page"
