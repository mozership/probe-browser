# The end-to-end tests: a fixture page served here, and the action built from
# this checkout run against it through Probe, rather than against a public
# site whose content can change under the test. Run it from the repository
# root, with the action built and probe on PATH:
#
#   go build -o e2e/action/probe-browser . && probe e2e/workflow.yml
#
# On CI, where CI is set, the browser runs on an Xvfb display; elsewhere the
# examples run headless.
name: probe-browser e2e

vars:
  ci: "{{ CI ?? '' }}"

jobs:
- name: Browser
  steps:
  # The server is built apart and its binary run, rather than through go run,
  # so that the process stopped at the end is the server itself.
  - name: Build the fixture page server
    uses: shell
    with:
      cmd: go build -o e2e/server/server ./e2e/server
      timeout: 2m
    test: res.code == 0

  - name: Start the fixture page server
    uses: shell
    with:
      background: true
      cmd: e2e/server/server
      ready:
        log: Serving HTTP
      timeout: 10s
    test: status == -1

  - name: Start Xvfb
    uses: shell
    skipif: vars.ci == ""
    with:
      background: true
      cmd: Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp
    test: status == -1

  - name: Wait for Xvfb to be ready
    uses: shell
    skipif: vars.ci == ""
    with:
      cmd: xdpyinfo -display :99 >/dev/null 2>&1
    retry:
      max_attempts: 20
      interval: "0.5s"
      initial_delay: "0.5s"
    test: res.code == 0

  - name: examples.yml
    uses: shell
    with:
      cmd: probe e2e/examples.yml
      timeout: 2m
      env:
        DISPLAY: ":99"
    test: res.code == 0
    echo: "{{res.stdout}}"

  - name: state.yml
    uses: shell
    with:
      cmd: probe e2e/state.yml
      timeout: 2m
      env:
        DISPLAY: ":99"
    test: res.code == 0
    echo: "{{res.stdout}}"

  - name: A failed browser action saves the page
    uses: shell
    with:
      cmd: |
        dir=$(mktemp -d)
        EVIDENCE_DIR="$dir" probe e2e/failure.yml
        echo "exit=$?"
        ls "$dir"
        grep -q "<h1>Probe Browser Fixture</h1>" "$dir"/probe-browser-failure-*.html && echo html-ok
        for f in "$dir"/probe-browser-failure-*.png; do
          [ "$(head -c 4 "$f" | tail -c 3)" = "PNG" ] && echo png-ok
        done
        rm -rf "$dir"
      timeout: 1m
      env:
        DISPLAY: ":99"
    test: |
      res.stdout contains "exit=3" &&
      res.stdout contains "page at failure: url http://localhost:8090/" &&
      res.stdout matches "probe-browser-failure-[0-9]+\\.png" &&
      res.stdout matches "probe-browser-failure-[0-9]+\\.html" &&
      res.stdout contains "html-ok" &&
      res.stdout contains "png-ok"

  - name: A text that never comes fails with the last text read
    uses: shell
    with:
      cmd: |
        dir=$(mktemp -d)
        EVIDENCE_DIR="$dir" probe e2e/text-failure.yml
        echo "exit=$?"
        ls "$dir"
        rm -rf "$dir"
      timeout: 1m
      env:
        DISPLAY: ":99"
    test: |
      res.stdout contains "exit=3" &&
      res.stdout contains 'wait_text "#status": the text was "Ready: 3 items", want "Done"' &&
      res.stdout matches "probe-browser-failure-[0-9]+\\.png"

  - name: A select that cannot choose fails with the reason
    uses: shell
    with:
      cmd: |
        dir=$(mktemp -d)
        EVIDENCE_DIR="$dir" probe e2e/select-failure.yml
        echo "exit=$?"
        rm -rf "$dir"
      timeout: 1m
      env:
        DISPLAY: ":99"
    test: |
      res.stdout contains "exit=3" &&
      res.stdout contains 'select "#size": no option has the value or label "xxxl"; the values are ["s","m","l","xl","xxl"]' &&
      res.stdout contains 'select "#size": the option "xl" is disabled' &&
      res.stdout contains 'select "#size": the option "xxl" is disabled' &&
      res.stdout contains 'select "#color": the <select> is disabled' &&
      res.stdout contains 'select "h1": the element is a <h1>, not a <select>'
