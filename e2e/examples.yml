name: Browser Examples
description: |
  Minimal test to verify browser can start.
  Serve the fixture page first, as e2e/workflow.yml does:
  go run ./e2e/server

actions:
  browser: ./action

vars:
  ci: "{{ CI ?? '' }}"
  url: "{{ URL ?? 'http://localhost:8090' }}"

jobs:
- name: Get element text
  steps:
  - name: Simple Navigation Test
    uses: browser
    with:
      headless: true
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/"
      - name: wait_visible
        selector: h1
      - name: text
        id: heading
        selector: "h1"
    test: res.code == 0 && res.results.heading == "Probe Browser Fixture"
    echo: |
      Heading: {{res.results.heading}}
      -----
    outputs:
      load_time: rt.duration

- name: Wait for a text
  steps:
  - name: Status that changes after loading
    uses: browser
    with:
      headless: true
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/"
      - name: wait_text
        id: ready
        selector: "#status"
        contains: Ready
      - name: wait_text
        id: equal
        selector: "#status"
        equals: "Ready: 3 items"
      - name: wait_text
        id: count
        selector: "#status"
        matches: '\d+ items$'
    test: |
      res.code == 0 &&
      res.results.ready == "Ready: 3 items" &&
      res.results.equal == "Ready: 3 items" &&
      res.results.count == "Ready: 3 items"

- name: Choose an option
  steps:
  - name: Choose by value, then by label
    uses: browser
    with:
      headless: true
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/"
      - name: select
        selector: "#size"
        value: m
      - name: wait_text
        id: by_value
        selector: "#chosen"
        equals: "chosen: m"
      - name: select
        selector: "#size"
        value: Large
      - name: wait_text
        id: by_label
        selector: "#chosen"
        equals: "chosen: l"
      - name: value
        id: size
        selector: "#size"
    test: |
      res.code == 0 &&
      res.results.by_value == "chosen: m" &&
      res.results.by_label == "chosen: l" &&
      res.results.size == "l"

- name: Capture screenshot
  steps:
  - name: Fixture page
    uses: browser
    with:
      window_w: 1280
      window_h: 800
      headless: "{{ vars.ci != '' }}"
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/"
      - name: capture_screenshot
        path: ./e2e/capture_screenshot.png
      - name: full_screenshot
        id: full_page
    test: res.code == 0 && res.filepaths.full_page endsWith ".png"
    echo: "Full page: {{res.filepaths.full_page}}"
