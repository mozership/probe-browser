<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Probe Browser One Tab Fixture</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <h1>One tab</h1>
  <!-- A link and a button that open a window of their own. -->
  <a id="new-window" href="/index.html" target="_blank">The fixture page in a new window</a>
  <button id="open" type="button">Open the input page</button>
  <!-- A link of a new window whose click the page cancels, which stays. -->
  <a id="canceled" href="/input.html" target="_blank">A link the page cancels</a>
  <button id="hover-me" type="button">Hover me</button>
  <p id="entered">none</p>
  <script>
    document.getElementById("open").addEventListener("click", () => window.open("/input.html"));
    document.getElementById("canceled").addEventListener("click", (e) => e.preventDefault());
    // mouseenter comes of the mouse moving onto the button, not of a
    // mouseover event sent to it.
    document.getElementById("hover-me").addEventListener("mouseenter", () => {
      document.getElementById("entered").textContent = "entered";
    });
  </script>
</body>
</html>
