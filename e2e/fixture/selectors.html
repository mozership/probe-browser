<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Probe Browser Selectors Fixture</title>
</head>
<body>
  <h1>Selectors</h1>

  <!-- Buttons a user tells apart by their text only: none has an id, a
       test id or a label. -->
  <div data-slot="card-content">
    <div>
      <button type="button">リカバリーコード</button>
      <button type="button">パスキー</button>
    </div>
  </div>
  <p id="picked">none</p>

  <ul data-slot="dropdown-menu-content">
    <li data-slot="dropdown-menu-item"><span>名前を変更</span></li>
    <li data-slot="dropdown-menu-item"><span>ラベルを削除</span></li>
  </ul>
  <p id="menu">none</p>

  <!-- A message body that a component renders into its shadow root. -->
  <div data-testid="message-body"></div>
  <p id="body-clicked">none</p>

  <!-- A closed shadow root, which no script outside it can reach. -->
  <div id="closed-host"></div>

  <!-- A button in a shadow root comes before one of the same text after
       it, in the order of the page. -->
  <div id="toolbar-host"></div>
  <button type="button" id="archive-light">Archive</button>
  <p id="archived">none</p>

  <!-- A host whose text is all in its own shadow root. -->
  <div id="own-host"></div>

  <!-- Inline elements in a shadow root, which run together on one line. -->
  <div id="inline-host"></div>

  <!-- A host whose shadow root shows its own children through a slot,
       inside an element of its own. -->
  <div id="slot-host"><b>Slotted words</b></div>

  <!-- Where a shadow root decides what shows: slots that hide what is
       slotted into them, an element with display: contents, a slot's own
       children where nothing is slotted, and a slot outside any shadow
       root, which is an element like any other. -->
  <div id="hidden-slot-host">Hidden bare text</div>
  <div id="none-slot-host">Hidden bare text</div>
  <div id="contents-host"></div>
  <div id="fallback-host"></div>
  <div id="light-slot"><slot>Light slot</slot></div>

  <!-- Text read from the flat tree as its style shows it, characters of the
       private use area as an icon font has, an SVG that hides some of its
       text, a line break not displayed, and a slot displayed as a block. -->
  <div id="pre-line-host" style="white-space: pre-line"></div>
  <div id="break-spaces-host" style="white-space: break-spaces"></div>
  <div id="private-use-host"></div>
  <div id="svg-host"></div>
  <div id="br-host"></div>
  <div id="block-slot-host">Middle</div>

  <!-- Text read from the flat tree as innerText reads it from the document:
       a blank line around a paragraph and for two line breaks, no-break
       spaces, a text-transform, spaces at the ends of an inline element, a
       slot slotted into another, and SVG text that keeps its spaces. -->
  <div id="paragraphs-host"></div>
  <div id="nbsp-host"></div>
  <div id="upper-host" style="text-transform: uppercase"></div>
  <div id="inline-space-host"></div>
  <div id="nested-slot-host"></div>
  <div id="svg-pre-host"></div>

  <!-- Text no slot shows: a child of a host whose shadow root has no slot,
       and a slot's own child where a node is slotted in its place. A
       button slotted in shows the slot's own words in place of nothing. -->
  <div id="unslotted-host"><span style="display: contents">Unslotted words</span></div>
  <div id="replaced-host"><b>Replacing words</b></div>
  <div id="fallback-click-host"></div>
  <p id="fallback-clicked">none</p>

  <!-- Preformatted text in an element read from the flat tree. -->
  <div id="pre-wrap"><span id="pre-shadow"></span><pre>  indented
    more</pre></div>

  <!-- A host that is hidden with visibility, which keeps its box. -->
  <div id="hidden-host" style="visibility: hidden"></div>

  <!-- An icon whose title holds the text of the button after it. -->
  <svg width="16" height="16"><title>Save</title><rect width="16" height="16"></rect></svg>
  <button type="button" id="save">Save</button>
  <p id="saved">none</p>

  <!-- Events in a shadow root that the page listens for outside it. -->
  <div id="events-host"></div>
  <p id="events">none</p>

  <script>
    const show = (id, text) => { document.getElementById(id).textContent = text; };
    document.querySelectorAll('[data-slot="card-content"] button').forEach((b) => {
      b.addEventListener("click", () => show("picked", "picked: " + b.textContent));
    });
    document.querySelectorAll('[data-slot="dropdown-menu-item"]').forEach((li) => {
      li.addEventListener("click", () => show("menu", "menu: " + li.textContent));
    });

    // The body arrives a moment after the page, as a fetched message does.
    setTimeout(() => {
      const root = document.querySelector('[data-testid="message-body"]').attachShadow({ mode: "open" });
      root.innerHTML = `
        <style>p { margin: 0; }</style>
        <p class="greeting">こんにちは</p>
        <p class="token">token: in-7f3a</p>
        <a href="#" class="unsubscribe">配信停止</a>`;
      root.querySelector(".unsubscribe").addEventListener("click", (e) => {
        e.preventDefault();
        show("body-clicked", "clicked: unsubscribe");
      });
    }, 500);

    document.getElementById("closed-host").attachShadow({ mode: "closed" }).innerHTML = "<p>closed</p>";

    const toolbar = document.getElementById("toolbar-host").attachShadow({ mode: "open" });
    toolbar.innerHTML = `<button type="button">Archive</button>`;
    toolbar.querySelector("button").addEventListener("click", () => show("archived", "archived: shadow"));
    document.getElementById("archive-light").addEventListener("click", () => show("archived", "archived: light"));

    document.getElementById("own-host").attachShadow({ mode: "open" }).innerHTML = "Own text";
    document.getElementById("inline-host").attachShadow({ mode: "open" }).innerHTML = "<span>Hello</span><span>world</span> <b>again</b>";
    document.getElementById("slot-host").attachShadow({ mode: "open" }).innerHTML = "<div>Framed: <slot></slot></div>";
    document.getElementById("hidden-slot-host").attachShadow({ mode: "open" }).innerHTML = '<slot style="visibility: hidden"></slot>';
    document.getElementById("none-slot-host").attachShadow({ mode: "open" }).innerHTML = '<div>Shown <slot style="display: none"></slot></div>';
    document.getElementById("contents-host").attachShadow({ mode: "open" }).innerHTML = '<div style="display: contents"><p>Contents child</p></div>';
    document.getElementById("fallback-host").attachShadow({ mode: "open" }).innerHTML = "<div><slot>Fallback words</slot></div>";
    document.getElementById("pre-line-host").attachShadow({ mode: "open" }).textContent = "one   two\n   three";
    document.getElementById("break-spaces-host").attachShadow({ mode: "open" }).textContent = "a   b";
    document.getElementById("private-use-host").attachShadow({ mode: "open" }).textContent = "icon \uE000\uE001\uE002\uE003 here";
    document.getElementById("svg-host").attachShadow({ mode: "open" }).innerHTML =
      '<svg width="200" height="40"><text y="20">Shown svg</text><text y="20" display="none">Hidden svg</text><text y="30">A<tspan visibility="hidden">hidden</tspan>B</text></svg>';
    document.getElementById("br-host").attachShadow({ mode: "open" }).innerHTML = 'One<br style="display: none">Two';
    document.getElementById("block-slot-host").attachShadow({ mode: "open" }).innerHTML = 'Before<slot style="display: block"></slot>After';
    document.getElementById("paragraphs-host").attachShadow({ mode: "open" }).innerHTML = "<p>x</p><p>y</p>One<br><br>Two";
    document.getElementById("nbsp-host").attachShadow({ mode: "open" }).innerHTML = "a&nbsp;&nbsp;b";
    document.getElementById("upper-host").attachShadow({ mode: "open" }).textContent = "Save draft";
    document.getElementById("inline-space-host").attachShadow({ mode: "open" }).innerHTML = "<span>Hello </span> world";
    document.getElementById("nested-slot-host").attachShadow({ mode: "open" }).innerHTML = 'Before<slot><slot style="display: block">Fallback</slot></slot>After';
    document.getElementById("svg-pre-host").attachShadow({ mode: "open" }).innerHTML =
      '<svg width="200" height="30"><text y="20" style="white-space: pre">a   b</text></svg>';
    document.getElementById("unslotted-host").attachShadow({ mode: "open" }).innerHTML = "<p>Shadow only</p>";
    document.getElementById("replaced-host").attachShadow({ mode: "open" }).innerHTML = '<div><slot><span style="display: contents">Fallback hidden</span></slot></div>';
    const fallbackClick = document.getElementById("fallback-click-host").attachShadow({ mode: "open" });
    fallbackClick.innerHTML = "<button type=\"button\"><slot>Fallback button</slot></button>";
    fallbackClick.querySelector("button").addEventListener("click", () => show("fallback-clicked", "clicked: fallback"));
    document.getElementById("pre-shadow").attachShadow({ mode: "open" }).innerHTML = "Shadow";
    document.getElementById("hidden-host").attachShadow({ mode: "open" }).innerHTML = "Hidden text";
    document.getElementById("save").addEventListener("click", () => show("saved", "saved"));

    // The page listens on the document, outside the shadow root, as an app
    // that delegates its events does.
    const events = document.getElementById("events-host").attachShadow({ mode: "open" });
    events.innerHTML = `<span class="tip">Tip</span> <input class="field"> <select class="choice"><option>a</option><option>b</option></select>`;
    const seen = [];
    for (const type of ["mouseover", "contextmenu", "input"]) {
      document.addEventListener(type, (e) => {
        if (e.composedPath()[0].getRootNode() === events) {
          seen.push(type + ":" + e.composedPath()[0].className);
          show("events", seen.join(" "));
        }
      });
    }
  </script>
</body>
</html>
