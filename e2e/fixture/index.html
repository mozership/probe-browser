<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Probe Browser Fixture</title>
</head>
<body>
  <h1>Probe Browser Fixture</h1>
  <p>A local page for the browser action examples, so they do not depend on a site outside the test.</p>
  <p id="status">Loading</p>
  <script>
    // The status changes after the page has loaded, as a page that fetches
    // its data does, so wait_text has a text to wait for.
    setTimeout(() => { document.getElementById("status").textContent = "Ready: 3 items"; }, 1000);
  </script>
  <label for="size">Size</label>
  <select id="size">
    <option value="s">Small</option>
    <option value="m">Medium</option>
    <option value="l">Large</option>
    <option value="xl" disabled>Extra large</option>
    <optgroup label="Sold out" disabled>
      <option value="xxl">Double extra large</option>
    </optgroup>
  </select>
  <fieldset disabled>
    <select id="color">
      <option value="red">Red</option>
    </select>
  </fieldset>
  <p id="chosen">none</p>
  <script>
    // The page learns of a choice only from its change event, so select has
    // to fire it for the text to change.
    document.getElementById("size").addEventListener("change", (e) => {
      document.getElementById("chosen").textContent = "chosen: " + e.target.value;
    });
  </script>
</body>
</html>
