name: Browser Read
description: |
  Reads the fixture page as an outline of its elements with read_page, one
  element alone by its ref, and the text it shows with page_text, and keeps
  the refs from one step to the next with session.
  Serve the fixture page first, as e2e/workflow.yml does:
  go run ./e2e/server
actions:
  browser: ./action
vars:
  url: "{{ URL ?? 'http://localhost:8090' }}"
jobs:
- name: Read
  steps:
  - name: Read the page as an outline and as text
    uses: browser
    with:
      headless: true
      session: true
      timeout: 30s
      actions:
      - name: navigate
        url: "{{vars.url}}/"
      - name: wait_text
        selector: "#status"
        equals: "Ready: 3 items"
      - name: read_page
        id: outline
      - name: read_page
        id: interactive
        filter: interactive
      - name: page_text
        id: text
    test: |
      res.code == 0 &&
      res.results.outline matches 'heading "Probe Browser Fixture" level=1 \\[ref_[a-z]{4}1\\]' &&
      res.results.outline contains 'text "Ready: 3 items"' &&
      res.results.outline contains 'combobox "Size" value="Small"' &&
      !(res.results.interactive contains "heading") &&
      res.results.interactive contains 'combobox "Size"' &&
      res.results.text contains "Probe Browser Fixture" &&
      res.results.text contains "Ready: 3 items"
    outputs:
      heading: res.results.outline | split("\n") | filter(# startsWith "heading") | first() | split("[") | last() | trimSuffix("]")

  - name: The next step reads an element by the ref the first read gave it
    uses: browser
    with:
      session: true
      timeout: 30s
      actions:
      - name: read_page
        id: heading
        ref: "{{outputs.heading}}"
    test: |
      res.code == 0 &&
      outputs.heading matches '^ref_[a-z]{4}1$' &&
      res.results.heading == 'heading "Probe Browser Fixture" level=1 [' + outputs.heading + ']'

- name: Act on refs
  steps:
  - name: Read the fields one can act on
    uses: browser
    with:
      headless: true
      session: true
      timeout: 30s
      actions:
      - name: navigate
        url: "{{vars.url}}/input.html"
      - name: read_page
        id: outline
        filter: interactive
    test: res.code == 0 && res.results.outline contains 'textbox "q" value="old"'
    outputs:
      q: res.results.outline | split("\n") | filter(# startsWith 'textbox "q"') | first() | split("[") | last() | trimSuffix("]")
      close: res.results.outline | split("\n") | filter(# startsWith 'button "Close"') | first() | split("[") | last() | trimSuffix("]")

  - name: The next step types into a field and clicks a button by their refs
    uses: browser
    with:
      session: true
      timeout: 30s
      actions:
      - name: type
        ref: "{{outputs.q}}"
        value: new
      - name: press
        ref: "{{outputs.q}}"
        value: Enter
      - name: wait_text
        selector: "#searched"
        equals: "searched: new"
      - name: value
        id: q
        ref: "{{outputs.q}}"
      - name: click
        ref: "{{outputs.close}}"
      - name: wait_not_visible
        selector: "#panel"
    test: res.code == 0 && res.results.q == "new"
