# It declares no guard: the action cannot tell what a page will do, so a
# step that uses it is refused under --read-only or --allow-host unless
# --allow-action names it.
name: browser
description: Drive a browser with chromedp
params: [actions, headless, window_w, window_h, viewport_w, viewport_h, evidence_dir, storage_state, passkeys, session, one_tab, timeout, virtual_authenticator]
cleanup: true
runs:
  using: binary
  url: https://github.com/mozership/probe-browser/releases/download/v0.10.1/probe-browser_{os}_{arch}
  checksums:
    darwin_amd64: "5f6737afdcf06bb1b63ccb64692c54ee6e9e15da80e329fea5baaccf2bd396e3"
    darwin_arm64: "b1b83dc369ff7b1f119f37ab12ff4198ede6d52b1a7b06c587181b6b4182be75"
    linux_amd64: "8f52aea1b0ba6bed65a7b51fc6bc1414459e3e3e508fc4650aa4507b4f6ed7b4"
    linux_arm64: "4a0435a2e347eeddb92cd2271c32feda0db9a2c103ea24309383bedba8fff9cf"
