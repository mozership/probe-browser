    darwin_arm64: "2eea354cf2de7bfb64c37bd3eee0082bd81525e4e60552152f23ca7babdb1603"
    linux_amd64: "957a19ad6d14d1f67b7a0fd8aa23394e9afd9448475e8ad7fd14dd522ecb1481"
    linux_arm64: "d5841b2f8fd34fba9ea76c6fee05bafdf23ed31f40d702fbcd2a7c32f5fc3214"
