# It declares no guard: the action cannot tell what a page will do, so a
# step that uses it is refused under --read-only or --allow-host unless
# --allow-action names it.
name: browser
description: Drive a browser with chromedp
params: [actions, headless, window_w, window_h, evidence_dir, storage_state, passkeys, session, one_tab, timeout, virtual_authenticator]
cleanup: true
runs:
  using: binary
  url: https://github.com/mozership/probe-browser/releases/download/v0.9.0/probe-browser_{os}_{arch}
