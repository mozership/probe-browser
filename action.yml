    darwin_arm64: "420b6d229e81d3e0128f5a0d9829824bca42e4dd3df24bc5ecb1e33ccf57b061"
    linux_amd64: "c50ed469fdf1792a58e86d2e3d1940510dd4f994f91fb0b989780f6e3a48228d"
    linux_arm64: "8a6aefd4042828447405f6faa2335ee006e31094f3f232b56927d1d0c7dbc9e8"
