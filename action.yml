# It declares no guard: the action cannot tell what a page will do, so a
# step that uses it is refused under --read-only or --allow-host unless
# --allow-action names it.
name: browser
description: Drive a browser with chromedp
params: [actions, headless, window_w, window_h, viewport_w, viewport_h, evidence_dir, storage_state, passkeys, session, one_tab, timeout, virtual_authenticator]
cleanup: true
runs:
  using: binary
  url: https://github.com/mozership/probe-browser/releases/download/v0.11.2/probe-browser_{os}_{arch}
  checksums:
    darwin_amd64: "fc7236057007122324a8da3fd5045ddbd66372c490dbb41bbd8617791892891a"
    darwin_arm64: "bcbc713a3897e958af2e643edbacdaafcf622fa2b6b86850f58022817806e404"
    linux_amd64: "833c82d7e4254cd6b756d5c520fac8bb74ac26ca89a64c792c29d1586b2839bc"
    linux_arm64: "6db2335230475b683264c92d3b57e674faea8c3d61e01408b2b2e2d693aa5a9e"
