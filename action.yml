    darwin_arm64: "53284c106b821a0aa7ceba4975ec93ee648b14bd7b42df828dd8c34b312518e4"
    linux_amd64: "a68a036353a37c9ad881cfb171aa84a151ff730ca3f25f682142ee35bf3cc46c"
    linux_arm64: "b57afd264644f27420e480545c546c79775512112d906f8500e1a55c2c15ae1b"
