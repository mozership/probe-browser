# It declares no guard: the action cannot tell what a page will do, so a
# step that uses it is refused under --read-only or --allow-host unless
# --allow-action names it.
name: browser
description: Drive a browser with chromedp
params: [actions, headless, window_w, window_h, viewport_w, viewport_h, evidence_dir, storage_state, passkeys, session, one_tab, timeout, virtual_authenticator]
cleanup: true
runs:
  using: binary
  url: https://github.com/mozership/probe-browser/releases/download/v0.10.0/probe-browser_{os}_{arch}
  checksums:
    darwin_amd64: "ffbe27de3b1e28072edc8bfa13f616158b8b6d930f724b0bd82e8e115b36267c"
    darwin_arm64: "e3f523490db8950640f24a3ff0c35c504674ff73bac5c246c16fd319beec23e8"
    linux_amd64: "7ee10087b593cbb2745fb75a1b62429aac207cba5605892247041bf302524414"
    linux_arm64: "e1410e39bd6cf0c52d3cfa62b27cbdb94c37707da450e105ac02d3e3f8f6cca7"
